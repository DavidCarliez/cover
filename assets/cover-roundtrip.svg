<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Cover reversible privacy flow</title>
  <desc id="desc">A three-stage example shows original private values, realistic replacements sent to an LLM, and the original values restored in the response. A second row explains Cover's six policy actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.52" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#10192b"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#67e8f9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 1.7px; }
      .panelTitle { font-size: 25px; font-weight: 760; fill: #f8fafc; }
      .panelCopy { font-size: 15px; fill: #91a4bf; }
      .codeLabel { font-size: 12px; font-weight: 700; fill: #7f92ad; letter-spacing: .7px; }
      .code { font-size: 14px; fill: #dce8f8; }
      .codePrivate { font-size: 14px; fill: #fda4af; }
      .codeFake { font-size: 14px; fill: #67e8f9; }
      .codeRestored { font-size: 14px; fill: #6ee7b7; }
      .modeTitle { font-size: 14px; font-weight: 750; fill: #f1f5f9; }
      .modeCopy { font-size: 11.5px; fill: #94a3b8; }
      .badge { font-size: 9.5px; font-weight: 800; letter-spacing: .75px; }
    </style>
  </defs>

  <rect width="1280" height="800" rx="28" fill="url(#background)"/>
  <rect width="1280" height="800" rx="28" fill="url(#grid)"/>
  <circle cx="1000" cy="20" r="290" fill="#7c3aed" opacity="0.075"/>
  <circle cx="260" cy="800" r="310" fill="#06b6d4" opacity="0.055"/>

  <g class="sans">
    <text x="640" y="48" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="2.4" fill="#67e8f9">COVER</text>
    <text x="640" y="82" text-anchor="middle" font-size="27" font-weight="760" fill="#f8fafc">Fake values go out. Real values come back.</text>

    <!-- You send -->
    <g filter="url(#shadow)">
      <rect x="42" y="116" width="362" height="314" rx="20" fill="#0c1526" stroke="#26354c"/>
    </g>
    <circle cx="72" cy="145" r="5" fill="#fb7185"/>
    <text class="eyebrow sans" x="88" y="150" fill="#fb7185">1 · YOU SEND</text>
    <text class="panelTitle sans" x="66" y="189">Useful, private context</text>
    <text class="panelCopy sans" x="66" y="216">Your agent works with the real environment.</text>
    <rect x="66" y="240" width="314" height="158" rx="13" fill="#07101e" stroke="#1e2b3f"/>
    <text class="codeLabel mono" x="84" y="269">PROMPT</text>
    <text class="code mono" x="84" y="299">Connect to <tspan class="codePrivate">10.20.30.40</tspan></text>
    <text class="code mono" x="84" y="329">Customer: <tspan class="codePrivate">Nike</tspan></text>
    <text class="code mono" x="84" y="359">Password: <tspan class="codePrivate">Winter2026!</tspan></text>
    <rect x="83" y="374" width="154" height="3" rx="1.5" fill="#fb7185" opacity=".75"/>

    <!-- LLM sees -->
    <g filter="url(#shadow)">
      <rect x="459" y="116" width="362" height="314" rx="20" fill="#0c1729" stroke="#27526a"/>
    </g>
    <circle cx="489" cy="145" r="5" fill="#67e8f9"/>
    <text class="eyebrow sans" x="505" y="150" fill="#67e8f9">2 · THE LLM SEES</text>
    <text class="panelTitle sans" x="483" y="189">Coherent fake values</text>
    <text class="panelCopy sans" x="483" y="216">Shape-preserving context, transformed locally.</text>
    <rect x="483" y="240" width="314" height="158" rx="13" fill="#07101e" stroke="#1d4053"/>
    <text class="codeLabel mono" x="501" y="269">PROTECTED REQUEST</text>
    <text class="code mono" x="501" y="299">Connect to <tspan class="codeFake">10.73.151.24</tspan></text>
    <text class="code mono" x="501" y="329">Customer: <tspan class="codeFake">alias-7q4n2</tspan></text>
    <text class="code mono" x="501" y="359">Password: <tspan class="codeFake">9%yQKX!4f2aL</tspan></text>
    <rect x="500" y="374" width="175" height="3" rx="1.5" fill="#22d3ee" opacity=".8"/>

    <!-- You receive -->
    <g filter="url(#shadow)">
      <rect x="876" y="116" width="362" height="314" rx="20" fill="#0d1926" stroke="#265443"/>
    </g>
    <circle cx="906" cy="145" r="5" fill="#6ee7b7"/>
    <text class="eyebrow sans" x="922" y="150" fill="#6ee7b7">3 · YOU GET BACK</text>
    <text class="panelTitle sans" x="900" y="189">The original context</text>
    <text class="panelCopy sans" x="900" y="216">Matching values are restored on the way back.</text>
    <rect x="900" y="240" width="314" height="158" rx="13" fill="#07101e" stroke="#214538"/>
    <text class="codeLabel mono" x="918" y="269">MODEL RESPONSE</text>
    <text class="code mono" x="918" y="299">Connected to <tspan class="codeRestored">10.20.30.40</tspan>.</text>
    <text class="code mono" x="918" y="329"><tspan class="codeRestored">Nike</tspan> credentials accepted.</text>
    <text class="code mono" x="918" y="359">Continue with the task.</text>
    <rect x="917" y="374" width="179" height="3" rx="1.5" fill="#34d399" opacity=".8"/>

    <!-- Flow arrows -->
    <path d="M412 275H447" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <rect x="397" y="238" width="64" height="22" rx="11" fill="#102c3b" stroke="#24566c"/>
    <text x="429" y="253" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing=".55" fill="#67e8f9">PROTECT</text>
    <path d="M829 275H864" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
    <rect x="814" y="238" width="64" height="22" rx="11" fill="#103229" stroke="#27604d"/>
    <text x="846" y="253" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing=".55" fill="#6ee7b7">RESTORE</text>

    <!-- Action matrix -->
    <text x="42" y="482" class="eyebrow sans" fill="#8fa5c1">ONE POLICY · SIX ACTIONS</text>
    <text x="1238" y="482" text-anchor="end" font-size="12" fill="#70839e">Choose per rule</text>

    <g transform="translate(42 505)">
      <rect width="190" height="190" rx="16" fill="#0b1725" stroke="#236155"/>
      <rect x="16" y="16" width="76" height="20" rx="10" fill="#123c34"/>
      <text class="badge sans" x="54" y="30" text-anchor="middle" fill="#6ee7b7">REVERSIBLE</text>
      <text class="modeTitle sans" x="16" y="62">Pseudonymize</text>
      <text class="modeCopy sans" x="16" y="84">Realistic, deterministic fake</text>
      <rect x="16" y="104" width="158" height="56" rx="10" fill="#07101e"/>
      <text class="mono" x="28" y="127" font-size="11" fill="#fb7185">10.20.30.40</text>
      <text class="mono" x="28" y="148" font-size="11" fill="#67e8f9">↔ 10.73.151.24</text>
      <text class="modeCopy sans" x="16" y="178" fill="#6ee7b7">Restored in responses</text>
    </g>

    <g transform="translate(243 505)">
      <rect width="190" height="190" rx="16" fill="#0b1725" stroke="#26556d"/>
      <rect x="16" y="16" width="76" height="20" rx="10" fill="#103247"/>
      <text class="badge sans" x="54" y="30" text-anchor="middle" fill="#67e8f9">REVERSIBLE</text>
      <text class="modeTitle sans" x="16" y="62">Placeholder</text>
      <text class="modeCopy sans" x="16" y="84">Explicit, compact token</text>
      <rect x="16" y="104" width="158" height="56" rx="10" fill="#07101e"/>
      <text class="mono" x="28" y="127" font-size="11" fill="#fb7185">Nike</text>
      <text class="mono" x="28" y="148" font-size="10.5" fill="#67e8f9">↔ ⟦RG:a1b2c3d4⟧</text>
      <text class="modeCopy sans" x="16" y="178" fill="#67e8f9">Restored in responses</text>
    </g>

    <g transform="translate(444 505)">
      <rect width="190" height="190" rx="16" fill="#0b1725" stroke="#34445c"/>
      <rect x="16" y="16" width="63" height="20" rx="10" fill="#202c3e"/>
      <text class="badge sans" x="47.5" y="30" text-anchor="middle" fill="#a7b5c8">ONE-WAY</text>
      <text class="modeTitle sans" x="16" y="62">Mask</text>
      <text class="modeCopy sans" x="16" y="84">Keep the edges, hide the rest</text>
      <rect x="16" y="104" width="158" height="56" rx="10" fill="#07101e"/>
      <text class="mono" x="28" y="127" font-size="11" fill="#fb7185">Winter2026!</text>
      <text class="mono" x="28" y="148" font-size="11" fill="#cbd5e1">→ Wi*******6!</text>
      <text class="modeCopy sans" x="16" y="178">No response restoration</text>
    </g>

    <g transform="translate(645 505)">
      <rect width="190" height="190" rx="16" fill="#0b1725" stroke="#34445c"/>
      <rect x="16" y="16" width="63" height="20" rx="10" fill="#202c3e"/>
      <text class="badge sans" x="47.5" y="30" text-anchor="middle" fill="#a7b5c8">ONE-WAY</text>
      <text class="modeTitle sans" x="16" y="62">Redact</text>
      <text class="modeCopy sans" x="16" y="84">Remove the matched value</text>
      <rect x="16" y="104" width="158" height="56" rx="10" fill="#07101e"/>
      <text class="mono" x="28" y="127" font-size="11" fill="#fb7185">ghp_••••••</text>
      <text class="mono" x="28" y="148" font-size="11" fill="#cbd5e1">→ [REDACTED]</text>
      <text class="modeCopy sans" x="16" y="178">No response restoration</text>
    </g>

    <g transform="translate(846 505)">
      <rect width="190" height="190" rx="16" fill="#0b1725" stroke="#713742"/>
      <rect x="16" y="16" width="52" height="20" rx="10" fill="#47232c"/>
      <text class="badge sans" x="42" y="30" text-anchor="middle" fill="#fda4af">LOCAL</text>
      <text class="modeTitle sans" x="16" y="62">Block</text>
      <text class="modeCopy sans" x="16" y="84">Reject the complete request</text>
      <rect x="16" y="104" width="158" height="56" rx="10" fill="#07101e"/>
      <circle cx="47" cy="132" r="13" fill="#4b202a" stroke="#fb7185"/>
      <path d="M40 125L54 139M54 125L40 139" stroke="#fda4af" stroke-width="2"/>
      <text class="mono" x="69" y="136" font-size="11" fill="#fda4af">NOT SENT</text>
      <text class="modeCopy sans" x="16" y="178" fill="#fda4af">Fails closed</text>
    </g>

    <g transform="translate(1047 505)">
      <rect width="191" height="190" rx="16" fill="#0b1725" stroke="#34445c"/>
      <rect x="16" y="16" width="67" height="20" rx="10" fill="#202c3e"/>
      <text class="badge sans" x="49.5" y="30" text-anchor="middle" fill="#a7b5c8">UNCHANGED</text>
      <text class="modeTitle sans" x="16" y="62">Allow</text>
      <text class="modeCopy sans" x="16" y="84">Record the match, pass it on</text>
      <rect x="16" y="104" width="159" height="56" rx="10" fill="#07101e"/>
      <text class="mono" x="28" y="127" font-size="11" fill="#cbd5e1">public-value</text>
      <text class="mono" x="28" y="148" font-size="11" fill="#cbd5e1">→ public-value</text>
      <text class="modeCopy sans" x="16" y="178">No transformation</text>
    </g>

    <path d="M42 735H1238" stroke="#24344b"/>
    <circle cx="48" cy="763" r="4" fill="#6ee7b7"/>
    <text x="62" y="768" font-size="12.5" fill="#8fa5c1">Matched values are transformed and restored locally. The configured LLM sees only their protected replacements.</text>
    <text x="1238" y="768" text-anchor="end" font-size="11" fill="#60728c">Illustrative values</text>
  </g>
</svg>
