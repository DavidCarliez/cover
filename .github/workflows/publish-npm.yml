name: Publish plugin package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Publish only what is on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing authenticates this workflow to npm with GitHub's
      # OIDC token, so no long-lived npm token is stored. It needs npm 11.5.1
      # or later and the trusted publisher set on npmjs.com for this workflow.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Test package
        working-directory: integrations/harness
        run: |
          npm run check
          npm test

      - name: Publish package
        working-directory: integrations/harness
        run: npm publish --access public --provenance
