name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Vet on every release platform
        run: |
          for os in linux darwin windows; do GOOS=$os go vet ./...; done
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { package: ./internal/redact, name: FuzzKnownValueNeverLeaks }
          - { package: ./internal/redact, name: FuzzHTTPContentPreservesUnchangedBytes }
          - { package: ./internal/redact, name: FuzzTransformErrorsAreGeneric }
          - { package: ./internal/proxy, name: FuzzSSERestorationIgnoresChunkBoundaries }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 60s ${{ matrix.target.package }}

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [codex, pi, omp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Synthetic conversation compatibility
        run: go test -race -count=1 ./internal/proxy -run 'TestClientConversationFixtures/${{ matrix.profile }}'
      - name: Cancellation, stalls, and interrupted streams
        run: go test -race -count=1 ./internal/proxy -run 'TestResponseIdleTimeoutAndActiveStream|TestStreamOverflowIsTransportFailure|TestHeartbeatAndInterleavedChannelsRestore'
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Test release installer
        run: bash scripts/install_test.sh

      - name: Test graceful daemon restart
        run: |
          go build -o "$RUNNER_TEMP/cover-lifecycle" ./cmd/cover
          COVER_TEST_BINARY="$RUNNER_TEMP/cover-lifecycle" node scripts/lifecycle_test.mjs

      - name: Test Pi and OMP plugin
        run: |
          npm run check --prefix integrations/harness
          npm test --prefix integrations/harness
          cd integrations/harness
          npm pack --dry-run

  harness-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install current harnesses
        run: |
          npm install --global @earendil-works/pi-coding-agent
          bun add --global @oh-my-pi/pi-coding-agent

      - name: Build Cover
        run: go build -o "${RUNNER_TEMP}/cover" ./cmd/cover

      - name: Run live privacy test through Pi and OMP
        env:
          COVER_TEST_BINARY: ${{ runner.temp }}/cover
        run: npm run test:e2e --prefix integrations/harness
