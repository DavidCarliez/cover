# Example Cover configuration.
# `cover init` writes this file to ~/.config/cover/config.yaml.

# Address the local proxy listens on. Point your agent's API base URL here.
listen: "127.0.0.1:8317"

# The real LLM API to forward (redacted) requests to. Any base URL works —
# Cover passes through method, path, query string, and headers.
upstream: "https://api.anthropic.com"

# Redaction events (category + count, never raw values) are appended here.
log_file: "~/.local/share/cover/redactions.log"

# Cover listens on loopback by default. Set allow_remote only when you
# deliberately expose the proxy and have separate network access controls.
network:
  allow_remote: false

# Hard caps prevent a peer or upstream from exhausting proxy memory. A request
# over its limit is rejected with 413; an oversized buffered response returns
# 502. An in-progress stream is terminated when its response or SSE-event cap
# is exceeded.
limits:
  request_bytes: 16777216  # 16 MiB
  response_bytes: 33554432 # 32 MiB
  sse_event_bytes: 4194304 # 4 MiB

# Timeouts for the upstream LLM API hop. response_header_timeout_ms applies
# only until the first response byte; the byte limits above remain active for
# streaming bodies.
upstream_timeouts:
  connect_timeout_ms: 10000
  response_header_timeout_ms: 120000

# Cache redaction results for identical string fields across requests.
cache:
  enabled: true
  max_entries: 10000

# Reversible mappings live only in memory. Send a stable session header when
# mappings must survive across multiple agent turns. Requests without the
# header receive an isolated, request-scoped mapping that is deleted afterward.
mappings:
  session_header: "X-Cover-Session"
  max_sessions: 128
  max_entries_per_session: 10000
  session_ttl_minutes: 60

# Image pixels are not inspected for sensitive content. Choose block when
# screenshots or other media must never leave the machine uninspected.
media:
  images: allow # allow, warn, or block

# Declarative policy rules. A rule selects data with pattern,
# detector: builtin_<type>, or a list of JSON object keys. Key matching is
# case-insensitive by default and applies to the entire string value.
# Actions: pseudonymize, placeholder, mask, redact, block, allow.
rules:
  password_fields:
    keys: [password, passwd, pwd, passphrase, user_password, database_password]
    category: password
    action: pseudonymize
    generator: password
    priority: 220
  internal_ipv4:
    detector: builtin_ipv4
    action: pseudonymize
    generator: ipv4
    priority: 20
  password:
    pattern: '(?i)(password|passwd|pwd)\s*[:=]\s*(?P<value>[^\s,;]+)'
    category: credential
    action: pseudonymize
    generator: password
    priority: 50
  forbidden_api_key:
    pattern: '(?i)api[_-]?key\s*[:=]\s*(?P<value>[A-Za-z0-9._-]{16,})'
    action: block
    priority: 100

detectors:
  regex:
    enabled: true
    builtin_categories:
      - aws_access_key
      - aws_secret_key
      - gcp_api_key
      - github_token
      - gitlab_token
      - slack_token
      - stripe_key
      - openai_key
      - anthropic_key
      - private_key_block
      - jwt
      - generic_api_key_assignment
      - email
      - ssn
      - credit_card
      - phone_us
      - phone_intl
      - iban
    # Add your own patterns, e.g. internal project codenames:
    custom_patterns: []
    #   - name: internal_proj
    #     pattern: 'PROJ-[0-9]{4,6}'

  # Optional local-LLM semantic detection pass for free-form sensitive
  # content regex can't catch (e.g. names, internal codenames, addresses).
  # When text explicitly labels values as test/example/synthetic data,
  # the LLM pass and secret-style regex matches are skipped; structured
  # PII (SSN, credit card, phone, IBAN, email) is always redacted.
  # Run `cover models pull` to download the llama-server binary and a
  # small GGUF model and populate server_path/model_path below, then set
  # enabled: true. If no prebuilt llama-server is available for your
  # platform, or the binary/model are missing, Cover logs a warning and
  # refuses startup or the affected request if the enabled detector is
  # unavailable. This prevents silent policy weakening.
  llm_fallback:
    enabled: false

    # Set by `cover models pull`.
    server_path: ""
    model_path: ""

    # Local port llama-server listens on.
    port: 8418

    # String fields shorter than min_text_len or longer than max_text_len
    # (in bytes) are skipped, to avoid wasting time on trivial or huge
    # fields.
    min_text_len: 8
    max_text_len: 2000

    # Per-call timeout for a single llama-server /completion request.
    request_timeout_ms: 3000
    # Total time budget for all LLM detector calls within one proxied
    # request, regardless of how many string fields it contains.
    overall_timeout_ms: 4000

    # Skip the LLM pass for a string when regex already found matches.
    skip_if_regex_matched: false

    # Parallel LLM calls per request (when batching is disabled).
    concurrency: 4

    # Strings per batched LLM /completion call. Set to 1 to disable batching.
    batch_size: 8

    # ggml-org/llama.cpp release tag `models pull` downloads from, or
    # "latest".
    llamacpp_release: "latest"
