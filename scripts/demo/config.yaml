listen: "127.0.0.1:19317"
upstream: "http://127.0.0.1:19318"
log_file: "/tmp/cover-demo-redactions.log"

pseudonymization:
  key_file: "/tmp/cover-demo-pseudonym.key"

rules:
  customer_name:
    pattern: '(?i)\bNIKE\b'
    category: customer
    action: pseudonymize
    generator: alias
    priority: 120

  private_ipv4:
    pattern: '\b(?P<value>10\.(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){2}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))\b'
    category: private_ip
    action: pseudonymize
    generator: ipv4
    priority: 110
